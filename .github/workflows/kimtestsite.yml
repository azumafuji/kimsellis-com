# This is a basic workflow to help you get started with Actions

name: KimsSite

# Controls when the action will run. Triggers the workflow on push
# events for the newtheme branch, or manual dispatch
on:
  push:
    branches:
      - newtheme
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_PAGES_DEPLOYMENT || secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          
